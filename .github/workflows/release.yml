name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: npx vsce package --out mpdf-$VERSION.vsix

      - name: Publish to the Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Secret VSCE_PAT is not set. Create a Marketplace PAT and add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx vsce publish --packagePath mpdf-$VERSION.vsix

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes are the CHANGELOG section of this version.
          awk -v v="$VERSION" '
            /^## \[/ { inside = index($0, "## [" v "]") == 1; next }
            inside
          ' CHANGELOG.md > notes.md
          {
            echo "Marketplace: https://marketplace.visualstudio.com/items?itemName=kkzk.mpdf"
            cat notes.md
            echo "Install manually: download \`mpdf-$VERSION.vsix\` below and run **Extensions: Install from VSIX...** in VS Code."
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" "mpdf-$VERSION.vsix" --title "mPDF $VERSION" --notes-file release-notes.md
